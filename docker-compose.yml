services:
  rag-app:
    build: .
    image: nvidia-rag-search:latest
    container_name: nvidia-rag-search
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./indexing/documents:/app/indexing/documents
      - ./faiss_index:/app/faiss_index
    shm_size: '8gb'
    ulimits:
      memlock: -1
      stack: 67108864
